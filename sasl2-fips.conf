# FIPS 140-3 Compliant SASL Configuration for PostgreSQL
# This file restricts SASL to use only FIPS-approved authentication mechanisms
#
# Location: /etc/sasl2/postgresql.conf
#
# FIPS-Approved Mechanisms:
#   - SCRAM-SHA-256: Uses SHA-256 via OpenSSL (FIPS-validated)
#   - GSSAPI: Uses AES encryption via Kerberos (FIPS-compliant)
#
# Note: mech_list works as an allowlist. Only specified mechanisms will be available.
#       Non-specified mechanisms (MD5-based, PLAIN, etc.) are automatically disabled.
#
# References:
# - RFC 5802: SCRAM-SHA-256 (FIPS-approved)
# - RFC 4752: GSSAPI (FIPS-compliant with AES)
# - FIPS 140-3 Implementation Guidance for SASL

# Enable only FIPS-approved SASL mechanisms
mech_list: SCRAM-SHA-256 GSSAPI

# SASL auxiliary property plugin configuration
# sasldb: Local SASL password database
auxprop_plugin: sasldb

# Logging (optional - useful for auditing)
# log_level: 7

# NOTE: This file should be verified at runtime to ensure PostgreSQL/libsasl2
#       actually loads and uses it. The file presence alone does not guarantee
#       its usage by the application.
