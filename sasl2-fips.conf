# FIPS 140-3 Compliant SASL Configuration for PostgreSQL
# This file restricts SASL to use only FIPS-approved authentication mechanisms
#
# Location: /etc/sasl2/postgresql.conf
#
# FIPS-Approved Mechanisms:
#   - SCRAM-SHA-256: Uses SHA-256 via OpenSSL (FIPS-validated)
#   - GSSAPI: Uses AES encryption via Kerberos (FIPS-compliant)
#
# Explicitly Disabled Non-FIPS Mechanisms:
#   - DIGEST-MD5: Uses MD5 (not FIPS-approved)
#   - CRAM-MD5: Uses MD5 (not FIPS-approved)
#   - NTLM: Uses MD4/MD5 (not FIPS-approved)
#   - OTP: Algorithm-dependent (may use MD5)
#   - SRP: Not in FIPS 140-3
#
# Configuration Documentation:
# - mech_list: Whitelist of allowed mechanisms (space-separated)
# - !MECHANISM: Explicitly disable a mechanism
#
# References:
# - RFC 5802: SCRAM-SHA-256 (FIPS-approved)
# - RFC 4752: GSSAPI (FIPS-compliant with AES)
# - FIPS 140-3 Implementation Guidance for SASL

# Enable only FIPS-approved SASL mechanisms
mech_list: SCRAM-SHA-256 GSSAPI PLAIN

# Explicitly disable all non-FIPS mechanisms
# This provides defense-in-depth even if client requests them
mech_list: !DIGEST-MD5 !CRAM-MD5 !NTLM !OTP !SRP

# SASL auxiliary property plugin configuration
# sasldb: Local SASL password database
auxprop_plugin: sasldb

# Logging (optional - useful for auditing)
# log_level: 7

# NOTE: PLAIN mechanism is included for compatibility but should ONLY be used
# over TLS-encrypted connections (LDAPS, StartTLS). Configure PostgreSQL to
# require TLS for all PLAIN authentication attempts.
